<!DOCTYPE html>
<!-- Intentionally inaccessible sample page. Do not "fix" - used by e2e tests. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Broken Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #fff; }
    .tagline { color: #bbb; }                 /* low contrast */
    .icon-btn { width: 16px; height: 16px; }  /* tiny target */
    .price { color: #ccc; background: #fff; }
    .go { background: #f90; color: #fff; border: 0; padding: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png">                      <!-- missing alt -->
    <p class="tagline">Best deals, every day</p>
  </div>
  <div class="nav">
    <a href="/cart"><img src="cart.png"></a>  <!-- empty link name -->
  </div>
  <h3>Featured</h3>
  <div class="product">
    <img src="shoe.jpg">                      <!-- missing alt -->
    <span class="price">$49.99</span>
    <button class="icon-btn" id="add-shoe"></button> <!-- empty button -->
  </div>
  <form id="checkout">
    <input type="text" placeholder="Email">   <!-- no label -->
    <input type="text" placeholder="Card number"> <!-- no label -->
    <select><option>Standard</option><option>Express</option></select> <!-- no label -->
    <div class="go" onclick="location.hash='done'">Buy now</div> <!-- div as button -->
  </form>
</body>
</html>
