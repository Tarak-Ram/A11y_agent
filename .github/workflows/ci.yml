name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx next build
        working-directory: apps/web

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
        working-directory: services/agents
      # Includes the e2e test: scans samples/broken-shop and expects >= 5 findings (axe-only, no Gemini key needed).
      - run: pytest -q
        working-directory: services/agents
